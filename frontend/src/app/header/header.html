<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()"><span class="shield-mark" aria-hidden="true">s.</span><span>SocialShield</span></a>
    <nav class="desktop-nav" aria-label="Navegación principal"><a routerLink="/" fragment="courses">Cursos</a><a routerLink="/" fragment="why">Sobre el proyecto</a><a routerLink="/login">Mi cuenta</a></nav>
    @if (profileName()) { <a class="profile-badge" routerLink="/perfil"><span class="profile-avatar" aria-hidden="true">{{ profileName()?.charAt(0)?.toUpperCase() }}</span><span>Hola, {{ profileName() }}</span></a> } @else { <a class="button button-orange desktop-cta" routerLink="/" fragment="courses">Ver cursos</a> }
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú"><span>{{ menuOpen() ? '×' : '☰' }}</span></button>
  </div>
  @if (menuOpen()) {
    <nav class="mobile-nav" aria-label="Navegación móvil"><a routerLink="/" fragment="courses" (click)="closeMenu()">Cursos</a><a routerLink="/" fragment="why" (click)="closeMenu()">Sobre el proyecto</a><a routerLink="/login" (click)="closeMenu()">Mi cuenta</a></nav>
  }
</header>
